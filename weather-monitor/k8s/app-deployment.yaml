apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: weather-monitor
spec:
  replicas: 2
  selector:
    matchLabels: { app: weather-app }
  template:
    metadata:
      labels: { app: weather-app }
    spec:
      containers:
        - name: weather-app
          image: ghcr.io/ТВОЙ_ЛОГИН/ТВОЙ_РЕПО:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
