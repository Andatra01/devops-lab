---
- name: Установка Docker
  become: yes
  block:
    - name: Добавление universe
      apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu/ {{ ansible_facts['distribution_release'] }} universe"
        state: present

    - name: Установка дополнительных пакетов
      apt:
        name:
          - ca-certificates
          - curl
        update-cache: yes
        cache_valid_time: 86400

    - name: Создание папки keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Добавление ключа Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Добавление репозитория Docker
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        mode: '0644'

    - name: Установка пакетов для Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes

    - name: Проверка что Docker установлен и перезагружен
      service:
        name: docker
        state: restarted
        enabled: yes

- name: Завершение установки
  become: yes
  block:
    - name: Добавление пользователя в группу Docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Перезагрузка
      reboot: