---
- name: Preconfig
  hosts: cluster
  become: true
  tasks:
    - name: Установка Docker и Docker Compose
      block:
        - name: Установить зависимости
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
            update_cache: true
            cache_valid_time: 86400

        - name: Создать директорию для ключей
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Скачать GPG-ключ Docker
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/debian/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'

        - name: Добавить репозиторий Docker (deb822)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/docker.sources
            content: |
              Types: deb
              URIs: https://download.docker.com/linux/debian
              Suites: {{ ansible_distribution_release }}
              Components: stable
              Architectures: {{ ansible_architecture | replace('x86_64', 'amd64') }}
              Signed-By: /etc/apt/keyrings/docker.asc
            owner: root
            group: root
            mode: '0644'

        - name: Обновить кэш APT
          ansible.builtin.apt:
            update_cache: true

        - name: Установить Docker CE
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
            state: present

        - name: Запустить и включить Docker
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

        - name: Установить Docker Compose
          ansible.builtin.apt:
            name: docker-compose-plugin
            state: present

      rescue:
        - name: Сообщение об ошибке установки
          ansible.builtin.debug:
            msg: "Ошибка при установке Docker/Compose"

      always:
        - name: Сообщение о завершении установки
          ansible.builtin.debug:
            msg: "Завершение блока установки"

    - name: Завершение установки
      block:
        - name: Добавление пользователя в группу Docker
          ansible.builtin.user:
            name: "kirata"
            groups: docker
            append: true

        - name: Проверка групп пользователя
          ansible.builtin.command: groups kirata
          register: groups_output
          changed_when: false

        - name: Вывод групп
          ansible.builtin.debug:
            msg: "Группы пользователя: {{ groups_output.stdout }}"

        - name: Инструкция
          ansible.builtin.debug:
            msg: |
              Группа docker добавлена.
              Выйдите и зайдите заново, или выполните newgrp docker.
